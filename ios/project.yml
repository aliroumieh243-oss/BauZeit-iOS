name: BauZeit
options:
  bundleIdPrefix: de.bauzeit
  xcodeVersion: "15.4"
  deploymentTarget:
    iOS: "16.0"
settings:
  SWIFT_VERSION: "5.9"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    version: "10.29.0"
targets:
  BauZeit:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: BauZeit
        excludes:
          - "**/*.plist"
      - path: BauZeit/GoogleService-Info.plist
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseAnalytics
    info:
      path: BauZeit/Info.plist
      properties:
        CFBundleIdentifier: de.bauzeit.app
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: de.bauzeit.app
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_STYLE: Automatic
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 1.0.0
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      GENERATE_INFOPLIST_FILE: false
      INFOPLIST_FILE: BauZeit/Info.plist
