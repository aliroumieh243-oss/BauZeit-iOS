name: Build Native iOS App (IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate
          # Ensure maximum backwards compatibility across Xcode 15 and 16
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' BauZeit.xcodeproj/project.pbxproj || true

      - name: Build Native iOS App Bundle
        run: |
          cd ios
          xcodebuild -project BauZeit.xcodeproj \
                     -scheme BauZeit \
                     -sdk iphoneos \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath $PWD/DerivedData \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=YES \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     clean build

      - name: Package into IPA
        run: |
          cd ios
          mkdir -p build/Payload
          cp -r DerivedData/Build/Products/Release-iphoneos/BauZeit.app build/Payload/
          cd build
          zip -r -9 BauZeit.ipa Payload
          echo "IPA erfolgreich erstellt!"
          ls -lh BauZeit.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BauZeit-Native-iOS-App
          path: ios/build/BauZeit.ipa
