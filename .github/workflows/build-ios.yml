name: Build Native iOS App (IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate

      - name: Build iOS Archive
        run: |
          cd ios
          xcodebuild -project BauZeit.xcodeproj \
                     -scheme BauZeit \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath $PWD/build/BauZeit.xcarchive \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     archive

      - name: Package into IPA
        run: |
          cd ios/build
          mkdir -p Payload
          cp -r BauZeit.xcarchive/Products/Applications/BauZeit.app Payload/
          zip -r BauZeit.ipa Payload
          echo "IPA erfolgreich erstellt!"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BauZeit-iOS-App
          path: ios/build/BauZeit.ipa
